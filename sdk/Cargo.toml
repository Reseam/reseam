[package]
name = "reseam-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Application integration SDK for Reseam clients"

[lib]
crate-type = ["rlib"]

[dependencies]
reseam-model = { workspace = true }
reseam-apk     = { workspace = true }
reseam-sign    = { workspace = true }
reseam-patcher = { workspace = true }
thiserror      = { workspace = true }
tempfile       = { workspace = true }
hex            = { workspace = true }
tracing        = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus"] }

[dev-dependencies]
ed25519-dalek = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }

[lints]
workspace = true
