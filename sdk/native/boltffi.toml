[package]
name = "reseam_sdk"
crate = "reseam-sdk-native"

[targets.apple]
enabled = false

[targets.wasm]
enabled = false

[targets.android]
enabled = true
output = "../dist/android"

[targets.android.kotlin]
package = "app.reseam.sdk"
output = "../generated"
module_name = "ReseamSdk"
desktop_loader = "bundled"

[targets.android.kotlin.desktop_pack]
enabled = true

[targets.android.pack]
output = "../jniLibs"
