<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'InterVariable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
	<style>
		.card { fill: #121212; stroke: #262626; stroke-width: 1.5; }
		.card-accent { fill: #121212; stroke: oklch(0.8808 0.0969 156.04); stroke-width: 1.5; }
		.inner { fill: #171717; stroke: none; }
		.chip { fill: #0a0a0a; stroke: #262626; stroke-width: 1; }
		.title { fill: #ededed; font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
		.label { fill: #a3a3a3; font-size: 11px; }
		.caption { fill: #a3a3a3; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; }
		.mono { fill: #ededed; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
		.mono-muted { fill: #a3a3a3; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
		.mono-dim { fill: #6b6b6b; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
		.mono-struck { fill: #6b6b6b; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-decoration: line-through; }
		.mono-accent { fill: oklch(0.8808 0.0969 156.04); font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
		.accent-fill { fill: oklch(0.8808 0.0969 156.04); }
		.link { stroke: #3f3f46; stroke-width: 1.5; fill: none; }
		.link-accent { stroke: oklch(0.8808 0.0969 156.04); stroke-width: 1.5; fill: none; }
		.arrowhead { fill: #3f3f46; }
		.arrowhead-accent { fill: oklch(0.8808 0.0969 156.04); }
	</style>
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
			<path d="M0,0 L10,5 L0,10 z" class="arrowhead" />
		</marker>
		<marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
			<path d="M0,0 L10,5 L0,10 z" class="arrowhead-accent" />
		</marker>
	</defs>


	<g transform="translate(40,40)">
		<rect class="card" x="0" y="0" width="300" height="390" rx="20" />
		<text class="caption" x="150" y="26" text-anchor="middle">Bundle project</text>
		<rect class="inner" x="20" y="44" width="260" height="326" rx="10" />
		<text class="mono" x="36" y="68">my-bundle/</text>
		<text class="mono" x="52" y="86">manifest.toml</text>
		<text class="mono-muted" x="52" y="104">settings.gradle.kts</text>
		<text class="mono-muted" x="52" y="122">gradlew</text>
		<text class="mono" x="52" y="140">apps/telegram/</text>
		<text class="mono" x="74" y="158">patch/src/main/kotlin/</text>
		<text class="mono-dim" x="96" y="176">HideSponsoredAdsPatch.kt</text>
		<text class="mono-dim" x="96" y="194">AntiDeletePatch.kt</text>
		<text class="mono" x="74" y="212">extensions/anti-delete/</text>
		<text class="mono-muted" x="96" y="230">src/main/java/</text>
		<text class="mono-dim" x="96" y="248">src/stubs/java/</text>
		<text class="mono" x="52" y="266">shared/settings-runtime/</text>
		<text class="mono-muted" x="74" y="284">src/main/java/</text>
		<text class="label" x="36" y="330">Directories are the configuration.</text>
		<text class="label" x="36" y="346">Modules have no build script.</text>
	</g>

	<line class="link" x1="342" y1="220" x2="396" y2="220" marker-end="url(#arrow)" />

	<g transform="translate(400,150)">
		<rect class="chip" x="0" y="0" width="180" height="140" rx="12" />
		<circle class="accent-fill" cx="20" cy="24" r="4" />
		<text class="title" x="32" y="28">./gradlew bundle</text>
		<text class="label" x="18" y="52">compiles each patch module</text>
		<text class="label" x="18" y="66">to a jar with classes.dex</text>
		<text class="label" x="18" y="84">runs d8 on each extension</text>
		<text class="label" x="18" y="106">reseam bundle pack hashes</text>
		<text class="label" x="18" y="120">every file and signs the manifest</text>
	</g>

	<line class="link-accent" x1="582" y1="220" x2="636" y2="220" marker-end="url(#arrow-accent)" />

	<g transform="translate(640,40)">
		<rect class="card-accent" x="0" y="0" width="280" height="390" rx="20" />
		<text class="caption" x="140" y="26" text-anchor="middle">Signed .reseam archive</text>
		<rect class="inner" x="20" y="44" width="240" height="326" rx="10" />
		<text class="mono-muted" x="36" y="68">mimetype</text>
		<text class="mono" x="36" y="86">manifest.toml</text>
		<text class="mono-dim" x="52" y="104">[files] sha256 per entry</text>
		<text class="mono-dim" x="52" y="122">engine = version that packed</text>
		<text class="mono" x="36" y="140">manifest.pubkey</text>
		<text class="mono" x="36" y="158">manifest.sig</text>
		<text class="mono-accent" x="36" y="176">telegram-patches.jar</text>
		<text class="mono-accent" x="36" y="194">telegram-anti-delete.dex</text>
		<text class="mono-accent" x="36" y="212">settings-runtime.dex</text>
		<text class="label" x="36" y="286">Clients verify the signature against</text>
		<text class="label" x="36" y="302">the public key in patches.json.</text>
		<text class="label" x="36" y="330">No sources, no Gradle scripts.</text>
	</g>
</svg>
