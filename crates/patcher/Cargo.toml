[package]
name = "reseam-patcher"
version.workspace = true
edition = "2021"
description = "Patch execution engine for Reseam with Kotlin JVM bridge support"
readme = "README.md"

[lib]
crate-type = ["lib"]

[dependencies]
reseam-apk          = { workspace = true }
reseam-sign         = { workspace = true, optional = true }
thiserror   = { workspace = true }
serde       = { workspace = true }
toml        = { workspace = true }
smallvec    = { workspace = true }
rustc-hash  = { workspace = true }
boltffi     = { workspace = true, optional = true }
jni         = { workspace = true, optional = true }
zip         = { workspace = true }
anyhow      = { workspace = true }
tracing     = { workspace = true }
tempfile    = { workspace = true }
ed25519-dalek = { workspace = true }
sha2        = { workspace = true }
hex         = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
libloading  = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = ["kotlin"]
kotlin = ["dep:boltffi", "dep:jni", "dep:reseam-sign"]

[build-dependencies]
cc = "1"
