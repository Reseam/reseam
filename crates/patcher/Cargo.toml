[package]
name = "reseam-patcher"
version = "0.1.0"
edition = "2021"
description = "Patch execution engine for Reseam with Kotlin JVM bridge support"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
reseam-apk          = { workspace = true }
reseam-patcher-macros = { workspace = true }
thiserror   = { workspace = true }
serde       = { workspace = true }
toml        = { workspace = true }
smallvec    = { workspace = true }
boltffi     = { workspace = true, optional = true }
jni         = { workspace = true, optional = true }
zip         = { workspace = true }
anyhow      = { workspace = true }
tracing     = { workspace = true }
tempfile    = { workspace = true }
ed25519-dalek = { workspace = true }
sha2        = { workspace = true }
hex         = { workspace = true }


[dev-dependencies]

[features]
default = ["kotlin"]
kotlin = ["dep:boltffi", "dep:jni"]

[build-dependencies]
cc = "1"
