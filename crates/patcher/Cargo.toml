[package]
name = "reseam-patcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Patch execution engine for Reseam with Kotlin JVM bridge support"
readme = "README.md"

[lib]
crate-type = ["rlib"]

[dependencies]
reseam-storage = { workspace = true }
reseam-hermes = { workspace = true }
reseam-model = { workspace = true }
reseam-apk          = { workspace = true }
reseam-sign         = { workspace = true, optional = true }
thiserror   = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }
smallvec    = { workspace = true }
rustc-hash  = { workspace = true }
boltffi     = { workspace = true, optional = true }
jni         = { workspace = true, optional = true }
zip         = { workspace = true }
anyhow      = { workspace = true }
tracing     = { workspace = true }
tempfile    = { workspace = true }
ed25519-dalek = { workspace = true }
sha2        = { workspace = true }
hex         = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "wasi")))'.dependencies]
libloading  = { workspace = true }

[features]
default = ["kotlin"]
kotlin = ["bridge", "dep:jni"]
bridge = ["dep:boltffi", "dep:reseam-sign"]
browser = ["bridge"]

[build-dependencies]
cc = "1"

[lints]
workspace = true
