[package]
name = "reseam-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line interface for the Reseam APK patching toolchain"
readme = "README.md"

[[bin]]
name = "reseam"
path = "src/main.rs"

[dependencies]
reseam-storage = { workspace = true }
reseam-model   = { workspace = true }
reseam-sdk     = { workspace = true, features = ["kotlin"] }
clap           = { workspace = true }
anyhow         = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
hex            = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
time           = { workspace = true }
tempfile       = { workspace = true }
ureq           = { workspace = true }
rusty-s3       = { workspace = true }
url            = { workspace = true }
semver         = { workspace = true }

[lints]
workspace = true
