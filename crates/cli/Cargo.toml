[package]
name = "stitch-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for the Stitch APK patching toolchain"
readme = "README.md"

[[bin]]
name = "stitch"
path = "src/main.rs"

[dependencies]
stitch-patcher = { workspace = true, features = ["kotlin"] }
stitch-sign    = { workspace = true }
stitch-apk     = { workspace = true }
clap           = { workspace = true }
anyhow         = { workspace = true }
tempfile       = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
ed25519-dalek  = { workspace = true }
sha2           = { workspace = true }
hex            = { workspace = true }
zip            = { workspace = true }
toml           = { workspace = true }
serde          = { workspace = true }
rand           = "0.8"
