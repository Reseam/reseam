<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" font-family="'InterVariable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
	<style>
		.card { fill: #121212; stroke: #262626; stroke-width: 1.5; }
		.card-accent { fill: #121212; stroke: oklch(0.8808 0.0969 156.04); stroke-width: 1.5; }
		.inner { fill: #171717; stroke: none; }
		.title { fill: #ededed; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
		.label { fill: #a3a3a3; font-size: 11px; }
		.caption { fill: #a3a3a3; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; }
		.mono { fill: oklch(0.8808 0.0969 156.04); font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
		.bar { fill: #262626; }
		.accent-fill { fill: oklch(0.8808 0.0969 156.04); }
		.accent-stroke { stroke: oklch(0.8808 0.0969 156.04); stroke-width: 1.5; fill: none; }
		.ring { fill: none; stroke: #262626; stroke-width: 1.2; }
	</style>

	<g transform="translate(40,40)">
		<rect class="card" x="0" y="0" width="170" height="170" rx="18" />
		<rect class="inner" x="20" y="20" width="130" height="64" rx="10" />
		<rect class="bar" x="32" y="36" width="56" height="4" rx="2" />
		<rect class="bar" x="32" y="48" width="76" height="4" rx="2" />
		<rect class="accent-fill" x="32" y="64" width="38" height="4" rx="2" />
		<text class="mono" x="20" y="108">reseam patch</text>
		<text class="title" x="20" y="134">Apply</text>
		<text class="label" x="20" y="152">Run a bundle against an APK.</text>
	</g>

	<g transform="translate(230,40)">
		<rect class="card" x="0" y="0" width="170" height="170" rx="18" />
		<rect class="inner" x="20" y="20" width="130" height="64" rx="10" />
		<rect class="bar" x="32" y="34" width="86" height="4" rx="2" />
		<rect class="bar" x="32" y="46" width="64" height="4" rx="2" />
		<rect class="accent-fill" x="32" y="58" width="98" height="4" rx="2" />
		<rect class="bar" x="32" y="70" width="72" height="4" rx="2" />
		<text class="mono" x="20" y="108">reseam perf</text>
		<text class="title" x="20" y="134">Bench</text>
		<text class="label" x="20" y="152">Time per-phase costs.</text>
	</g>

	<g transform="translate(420,40)">
		<rect class="card" x="0" y="0" width="170" height="170" rx="18" />
		<rect class="inner" x="20" y="20" width="130" height="64" rx="10" />
		<circle class="accent-fill" cx="40" cy="52" r="5" />
		<rect class="bar" x="56" y="40" width="46" height="4" rx="2" />
		<rect class="bar" x="56" y="54" width="74" height="4" rx="2" />
		<rect class="bar" x="56" y="68" width="58" height="4" rx="2" />
		<text class="mono" x="20" y="108">reseam bundle</text>
		<text class="title" x="20" y="134">Pack</text>
		<text class="label" x="20" y="152">Keygen, sign, and inspect.</text>
	</g>

	<g transform="translate(610,40)">
		<rect class="card" x="0" y="0" width="170" height="170" rx="18" />
		<rect class="inner" x="20" y="20" width="130" height="64" rx="10" />
		<rect class="bar" x="32" y="34" width="20" height="4" rx="2" />
		<rect class="bar" x="32" y="46" width="98" height="4" rx="2" />
		<rect class="bar" x="32" y="58" width="84" height="4" rx="2" />
		<rect class="accent-fill" x="32" y="70" width="40" height="4" rx="2" />
		<text class="mono" x="20" y="108">reseam publish</text>
		<text class="title" x="20" y="134">Index</text>
		<text class="label" x="20" y="152">Write patches.json releases.</text>
	</g>

	<g transform="translate(800,40)">
		<rect class="card" x="0" y="0" width="170" height="170" rx="18" />
		<rect class="inner" x="20" y="20" width="130" height="64" rx="10" />
		<circle class="ring" cx="58" cy="52" r="16" />
		<line class="accent-stroke" x1="70" y1="64" x2="86" y2="80" />
		<text class="mono" x="20" y="108">reseam info</text>
		<text class="title" x="20" y="134">Inspect</text>
		<text class="label" x="20" y="152">Print APK metadata.</text>
	</g>
</svg>
