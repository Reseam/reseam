[package]
name = "reseam-sign"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "APK signing for Reseam with Android Signature Scheme v2"
readme = "README.md"

[dependencies]
reseam-storage = { workspace = true }
ring      = { workspace = true }
rayon     = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "zeroize"] }
x509-parser = { version = "0.18.1", default-features = false }
tempfile = { workspace = true }

[dev-dependencies]
flate2 = { workspace = true }
zip      = { workspace = true }

[lints]
workspace = true
