[package]
name = "stitch-apk"
version = "0.1.0"
edition = "2021"

[dependencies]
stitch-dex = { workspace = true }
thiserror  = { workspace = true }
zip        = { workspace = true }
rayon      = { workspace = true, optional = true }
memmap2    = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile          = { workspace = true }
criterion         = { workspace = true }
stitch-sign       = { workspace = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon", "stitch-dex/parallel"]
mmap = ["dep:memmap2", "stitch-dex/mmap"]

[[bench]]
name = "apk_bench"
harness = false
