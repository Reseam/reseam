[package]
name = "reseam-apk"
version = "0.1.0"
edition = "2021"
description = "APK container support for Reseam: ZIP, AXML, resources, and DEX extraction"
readme = "README.md"

[dependencies]
reseam-dex = { workspace = true }
thiserror  = { workspace = true }
zip        = { workspace = true }
quick-xml  = { workspace = true }
rayon      = { workspace = true }
tracing    = { workspace = true }
# Not used directly: switches `zip`'s flate2 to the zlib-rs backend for faster deflate.
flate2     = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile          = { workspace = true }
criterion         = { workspace = true }
reseam-sign       = { workspace = true }

[[bench]]
name = "apk_bench"
harness = false
