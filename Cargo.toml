[workspace]
resolver = "2"
members = [
    "crates/dex",
    "crates/apk",
    "crates/sign",
    "crates/patcher",
    "crates/patcher-macros",
    "crates/library",
    "crates/manager-ffi",
    "crates/cli"
]

[workspace.dependencies]
# Internal crates
reseam-dex     = { path = "crates/dex" }
reseam-apk     = { path = "crates/apk" }
reseam-sign    = { path = "crates/sign" }
reseam-patcher = { path = "crates/patcher" }
reseam-patcher-macros = { path = "crates/patcher-macros" }
reseam-library = { path = "crates/library" }

# Shared external dependencies (pinned versions for all crates)
thiserror   = "2"
bitflags    = "2"
smallvec    = "1"
sha1        = "0.10"
adler       = "1"
rayon       = "1.10"
memmap2     = "0.9"
zip         = "2"
quick-xml   = "0.37"
ring        = "0.17"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2        = "0.10"
hex         = "0.4"
tempfile    = "3"
toml        = "0.8"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
time        = { version = "0.3", features = ["formatting", "parsing"] }
boltffi     = "0.2"
jni         = { version = "0.21", features = ["invocation"] }
clap        = { version = "4", features = ["derive"] }
anyhow      = "1"
libc        = "0.2"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Shared dev dependencies
pretty_assertions = "1"
criterion         = "0.5"
