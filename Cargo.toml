[workspace]
resolver = "2"
members = [
    "crates/dex",
    "crates/apk",
    "crates/sign",
    "crates/patcher",
    "crates/patcher-macros",
    "crates/patch-api",
    "crates/patch-macros",
    "crates/cli",
]

[workspace.dependencies]
# Internal crates
stitch-dex     = { path = "crates/dex" }
stitch-apk     = { path = "crates/apk" }
stitch-sign    = { path = "crates/sign" }
stitch-patcher = { path = "crates/patcher" }
stitch-patcher-macros = { path = "crates/patcher-macros" }
stitch-patch-api = { path = "crates/patch-api" }
stitch-patch-macros = { path = "crates/patch-macros" }

# Shared external dependencies (pinned versions for all crates)
thiserror   = "2"
bitflags    = "2"
smallvec    = "1"
sha1        = "0.10"
adler       = "1"
rayon       = "1.10"
memmap2     = "0.9"
zip         = "2"
quick-xml   = "0.37"
ring        = "0.17"
mlua        = { version = "0.10", features = ["lua54", "vendored"] }
toml        = "0.8"
serde       = { version = "1", features = ["derive"] }
wasmtime    = "31"
wasmtime-wasi = "31"
clap        = { version = "4", features = ["derive"] }
anyhow      = "1"
libc        = "0.2"

# Shared dev dependencies
pretty_assertions = "1"
criterion         = "0.5"
tempfile          = "3"
