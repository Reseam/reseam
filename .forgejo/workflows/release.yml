name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: docker
    container:
      image: rust:1-bookworm
    env:
      LZMA_API_STATIC: "1"
      HOST_CLASSIFIER: linux-x86_64
    steps:
      - name: Install base apt packages
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl unzip zstd

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: https://github.com/actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: https://github.com/android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708
          packages: 'platforms;android-36 build-tools;34.0.0 ndk;29.0.14206865'

      - name: Add Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Cache cargo build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('.cargo/config.toml') }}

      - name: Cache boltffi_cli binary
        id: boltffi-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/boltffi
          key: boltffi-cli-0.24.1

      - name: Install boltffi_cli
        if: steps.boltffi-cache.outputs.cache-hit != 'true'
        run: cargo install boltffi_cli --version 0.24.1 --locked

      - name: Set up Gradle
        uses: https://github.com/gradle/actions/setup-gradle@v5

      - name: Regenerate patch-api bindings
        run: cargo xtask regen patch-api

      - name: Regenerate SDK bindings and Android jniLibs
        run: cargo xtask regen sdk

      - name: Build reseam-cli release binary
        run: cargo build --release -p reseam-cli

      - name: Build desktop JNI shim
        run: cargo xtask jni-host --crate sdk

      - name: Publish artifacts to Forgejo Maven
        env:
          FORGEJO_PACKAGES_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SDK_VERSION="${TAG#v}"

          publish_pom_keyed() {
            local artifact_id="$1"
            local working_dir="$2"
            local pom_url="https://git.reseam.app/api/packages/reseam/maven/app/reseam/${artifact_id}/${SDK_VERSION}/${artifact_id}-${SDK_VERSION}.pom"
            if curl -fsS -H "Authorization: token ${FORGEJO_PACKAGES_TOKEN}" -o /dev/null "$pom_url"; then
              echo "app.reseam:${artifact_id}:${SDK_VERSION} already exists; skipping publish"
            else
              (cd "$working_dir" && ./gradlew publishAllPublicationsToForgejoRepository -PreseamSdkVersion="${SDK_VERSION}" --no-daemon)
            fi
          }

          publish_jar_keyed() {
            local artifact_id="$1"
            local working_dir="$2"
            local classifier="$3"
            local jar_url="https://git.reseam.app/api/packages/reseam/maven/app/reseam/${artifact_id}/${SDK_VERSION}/${artifact_id}-${SDK_VERSION}-${classifier}.jar"
            if curl -fsS -I -H "Authorization: token ${FORGEJO_PACKAGES_TOKEN}" -o /dev/null "$jar_url"; then
              echo "app.reseam:${artifact_id}:${SDK_VERSION}:${classifier} already exists; skipping publish"
            else
              (cd "$working_dir" && ./gradlew publishAllPublicationsToForgejoRepository -PreseamSdkVersion="${SDK_VERSION}" -PreseamHostClassifier="${classifier}" --no-daemon)
            fi
          }

          publish_pom_keyed "reseam-patch-sdk" "patch-api"
          publish_pom_keyed "reseam-sdk-android" "sdk-android"
          publish_jar_keyed "reseam-sdk-jvm" "sdk-jvm" "${HOST_CLASSIFIER}"

      - name: Stage CLI binary for release
        run: install -D -m 0755 target/release/reseam dist/reseam-linux-x64

      - name: Upload to Forgejo release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.11.1
        with:
          direction: upload
          url: https://git.reseam.app
          repo: reseam/reseam
          tag: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: dist
          override: true
