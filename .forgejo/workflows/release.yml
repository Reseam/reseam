name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates nodejs openjdk-17-jdk-headless zstd

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/boltffi
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ hashFiles('Cargo.lock') }}-
            cargo-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('kotlin-sdk/**/*.gradle.kts', 'kotlin-sdk/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - run: |
          if ! cargo install --list | grep -q '^boltffi_cli v0\.23\.1:'; then
            cargo install boltffi_cli --version 0.23.1 --locked
          fi

      - run: ./kotlin-sdk/regenerate.sh
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - run: cargo build --release -p reseam-cli
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SDK_VERSION="${TAG#v}"
          SDK_POM="https://git.reseam.app/api/packages/reseam/maven/app/reseam/reseam-patch-sdk/${SDK_VERSION}/reseam-patch-sdk-${SDK_VERSION}.pom"
          if curl -fsS -H "Authorization: token ${FORGEJO_PACKAGES_TOKEN}" -o /dev/null "$SDK_POM"; then
            echo "app.reseam:reseam-patch-sdk:${SDK_VERSION} already exists; skipping publish"
          else
            ./gradlew publishAllPublicationsToForgejoRepository -PreseamSdkVersion="${SDK_VERSION}" --no-daemon
          fi
        working-directory: kotlin-sdk
        env:
          FORGEJO_PACKAGES_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}

      - run: install -D -m 0755 target/release/reseam dist/reseam-linux-x64

      - uses: https://code.forgejo.org/actions/forgejo-release@v2.11.1
        with:
          direction: upload
          url: https://git.reseam.app
          repo: reseam/reseam
          tag: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: dist
          override: true
