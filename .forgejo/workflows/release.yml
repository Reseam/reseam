name: release

on:
  push:
    tags:
      - 'v*'
  # Builds everything a release would, without publishing, to validate a release or warm the caches.
  workflow_dispatch:

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: docker
    container:
      image: cimg/android:2026.03-node
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GRADLE_OPTS: -Xmx1g
      RUST_VERSION: 1.98.1
      RUST_TARGETS: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android,x86_64-pc-windows-gnullvm,wasm32-wasip1
      LLVM_MINGW_VERSION: '20260922'
      TEMURIN_WINDOWS_VERSION: '21.0.8+9'
      CC_x86_64_pc_windows_gnullvm: x86_64-w64-mingw32-clang
      AR_x86_64_pc_windows_gnullvm: llvm-ar
      CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER: x86_64-w64-mingw32-clang
      NDK_VERSION: 29.0.14206865
    steps:
      # actions/cache compresses with zstd when it is on PATH; the image only has gzip.
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd xz-utils

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Cache the Rust toolchain
        uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: rustup-${{ env.RUST_VERSION }}-android-windows

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt,clippy
          targets: ${{ env.RUST_TARGETS }}

      - name: Cache the Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/android-sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Install Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;$NDK_VERSION"

      - name: Cache cargo build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-bin: false

      - name: Cache boltffi_cli binary
        id: boltffi-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/boltffi
          key: boltffi-cli-${{ hashFiles('.boltffi-version') }}

      - name: Install boltffi_cli
        if: steps.boltffi-cache.outputs.cache-hit != 'true'
        run: cargo install boltffi_cli --version "=$(cat .boltffi-version)" --locked

      # Releases run on tags, which setup-gradle treats as read-only by default.
      - name: Set up Gradle
        uses: https://github.com/gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Regenerate patch-api bindings
        run: cargo xtask regen patch-api

      - name: Select the installed NDK and put its host clang on PATH
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Regenerate SDK bindings
        run: cargo xtask regen sdk

      - name: Build the shared patch runtime
        run: cargo xtask runtime

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check workspace lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Kotlin formatting, application bindings, and patch authoring ABI
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1536m spotlessCheck :reseam-sdk:compileKotlinJvm :reseam-patch-sdk:checkKotlinAbi

      - name: Test the workspace
        run: cargo test --workspace --no-fail-fast

      - name: Cache llvm-mingw
        id: llvm-mingw-cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}

      - name: Install llvm-mingw
        if: steps.llvm-mingw-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64.tar.xz" | tar -xJ -C ~
          mv ~/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64 ~/llvm-mingw

      - name: Cache the Windows JDK
        id: windows-jdk-cache
        uses: actions/cache@v4
        with:
          path: ~/jdk-windows
          key: temurin-windows-x64-${{ env.TEMURIN_WINDOWS_VERSION }}

      - name: Download the Windows JDK
        if: steps.windows-jdk-cache.outputs.cache-hit != 'true'
        run: |
          version="$TEMURIN_WINDOWS_VERSION"
          archive="OpenJDK21U-jdk_x64_windows_hotspot_${version/+/_}.zip"
          url="https://github.com/adoptium/temurin21-binaries/releases/download/jdk-${version/+/%2B}"
          curl -fsSL "$url/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fsSL "$url/$archive.sha256.txt" -o "$RUNNER_TEMP/$archive.sha256.txt"
          (cd "$RUNNER_TEMP" && sha256sum -c "$archive.sha256.txt")
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/jdk-windows"
          mv "$RUNNER_TEMP/jdk-windows/jdk-$version" "$HOME/jdk-windows"

      - name: Configure Windows cross-compilation
        run: |
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME_x86_64_pc_windows_gnullvm=$HOME/jdk-windows" >> "$GITHUB_ENV"

      - name: Package SDK JNI libraries
        run: cargo xtask pack-sdk

      - name: Build reseam-cli release binary
        run: cargo build --release -p reseam-cli

      - name: Build reseam-cli for Windows
        run: cargo build --release -p reseam-cli --target x86_64-pc-windows-gnullvm

      - name: Build the SDKs
        run: ./gradlew assemble --no-daemon -Dorg.gradle.jvmargs=-Xmx1536m

      - name: Install verified WASI SDK 33
        run: |
          archive="$RUNNER_TEMP/wasi-sdk.tar.gz"
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz -o "$archive"
          echo "0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-33.0-x86_64-linux" >> "$GITHUB_ENV"

      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Build the browser package
        run: |
          bun install --cwd browser --frozen-lockfile
          bun run --cwd browser engine
          bun run --cwd browser types

      - name: Check the tag names the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo xtask check-tag ${{ github.ref_name }}

      - name: Publish the SDKs to the Forgejo Maven registry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          FORGEJO_PACKAGES_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
        run: ./gradlew publishAllPublicationsToForgejoRepository -PreseamSdkVersion=${{ github.ref_name }} --no-daemon -Dorg.gradle.jvmargs=-Xmx1536m

      - name: Publish the browser package to the Forgejo npm registry
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: browser
        env:
          FORGEJO_PACKAGES_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
        run: |
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          npm config set //git.reseam.app/api/packages/reseam/npm/:_authToken "$FORGEJO_PACKAGES_TOKEN"
          npm publish

      - name: Stage the CLI
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          install -D target/release/reseam dist/reseam-linux-x64
          install -D target/x86_64-pc-windows-gnullvm/release/reseam.exe dist/reseam-windows-x64.exe

      # Before the Forgejo release, so every published tag has its CLI on the CDN.
      - name: Upload to the CDN
        if: startsWith(github.ref, 'refs/tags/')
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for f in dist/*; do
            curl -fsS --aws-sigv4 aws:amz:auto:s3 --user "$R2_ACCESS_KEY_ID:$R2_SECRET_ACCESS_KEY" \
              -H "Cache-Control: public, max-age=86400" \
              -T "$f" "$R2_ENDPOINT/reseam-releases/engine/${{ github.ref_name }}/${f##*/}"
          done

      - name: Upload to the Forgejo release
        if: startsWith(github.ref, 'refs/tags/')
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          url: https://git.reseam.app
          repo: reseam/reseam
          tag: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: dist
          override: true
