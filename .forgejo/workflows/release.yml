name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
      mode:
        description: Resume CLI publication after the SDKs have been published
        required: true
        default: full
        type: choice
        options:
          - full
          - cli-only

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: docker
    container:
      image: cimg/android:2026.03-node
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install Android NDK
        if: ${{ inputs.mode != 'cli-only' }}
        run: sdkmanager "ndk;29.0.14206865"

      - name: Add Rust Android targets
        if: ${{ inputs.mode != 'cli-only' }}
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Cache cargo build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('.cargo/config.toml') }}

      - name: Cache boltffi_cli binary
        id: boltffi-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/boltffi
          key: boltffi-cli-${{ hashFiles('.boltffi-version') }}

      - name: Install boltffi_cli
        if: steps.boltffi-cache.outputs.cache-hit != 'true'
        run: cargo install boltffi_cli --version "=$(cat .boltffi-version)" --locked

      - name: Check release tag and commit
        id: release
        run: |
          cargo xtask check-tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the SDKs are already published
        if: ${{ inputs.mode == 'cli-only' }}
        run: |
          version="${RELEASE_TAG#v}"
          registry="https://git.reseam.app/api/packages/reseam/maven/app/reseam"
          for artifact in reseam-patch-sdk.jar reseam-sdk.module reseam-sdk-jvm.jar reseam-sdk-android.aar reseam-gradle-plugin.jar; do
            name="${artifact%.*}"
            extension="${artifact##*.}"
            curl --fail --silent --show-error --head --retry 5 "$registry/$name/$version/$name-$version.$extension" > /dev/null
          done

      - name: Set up Gradle
        if: ${{ inputs.mode != 'cli-only' }}
        uses: https://github.com/gradle/actions/setup-gradle@v5

      - name: Regenerate patch-api bindings
        run: cargo xtask regen patch-api

      - name: Regenerate SDK bindings and Android jniLibs
        if: ${{ inputs.mode != 'cli-only' }}
        run: cargo xtask regen sdk

      - name: Check generated sources are committed
        run: git diff --exit-code

      - name: Build reseam-cli release binary
        run: cargo build --release -p reseam-cli

      - name: Build desktop JNI shim
        if: ${{ inputs.mode != 'cli-only' }}
        run: cargo xtask jni-host

      - name: Publish the SDKs to the Forgejo Maven registry
        if: ${{ inputs.mode != 'cli-only' }}
        env:
          FORGEJO_PACKAGES_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
        run: ./gradlew publishAllPublicationsToForgejoRepository -PreseamSdkVersion="$RELEASE_TAG" --no-daemon

      - name: Stage the CLI
        run: install -D target/release/reseam dist/reseam-linux-x64

      - name: Upload to the Forgejo release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          url: https://git.reseam.app
          repo: reseam/reseam
          tag: ${{ env.RELEASE_TAG }}
          sha: ${{ steps.release.outputs.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: dist
          override: true
