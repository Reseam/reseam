name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: docker
    container:
      image: rust:1-bookworm
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_PLATFORM_VERSION: "36"
      ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
      ANDROID_NDK_VERSION: "29.0.14206865"
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      HOST_CLASSIFIER: linux-x86_64
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl nodejs openjdk-17-jdk-headless unzip zstd

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: android-sdk-cache
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-platform-${{ env.ANDROID_PLATFORM_VERSION }}-buildtools-${{ env.ANDROID_BUILD_TOOLS_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}

      - if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/boltffi
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ hashFiles('Cargo.lock') }}-
            cargo-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('patch-api/**/*.gradle.kts', 'sdk-android/**/*.gradle.kts', 'sdk-jvm/**/*.gradle.kts', 'patch-api/gradle/wrapper/gradle-wrapper.properties', 'sdk-android/gradle/wrapper/gradle-wrapper.properties', 'sdk-jvm/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - run: |
          if ! cargo install --list | grep -q '^boltffi_cli v0\.24\.1:'; then
            cargo install boltffi_cli --version 0.24.1 --locked
          fi

      - run: cargo xtask regen patch-api
      - run: cargo xtask regen sdk
      - run: cargo build --release -p reseam-cli
      - run: cargo xtask jni-host --crate sdk

      - run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SDK_VERSION="${TAG#v}"

          publish_pom_keyed() {
            local artifact_id="$1"
            local working_dir="$2"
            local pom_url="https://git.reseam.app/api/packages/reseam/maven/app/reseam/${artifact_id}/${SDK_VERSION}/${artifact_id}-${SDK_VERSION}.pom"
            if curl -fsS -H "Authorization: token ${FORGEJO_PACKAGES_TOKEN}" -o /dev/null "$pom_url"; then
              echo "app.reseam:${artifact_id}:${SDK_VERSION} already exists; skipping publish"
            else
              (cd "$working_dir" && ./gradlew publishAllPublicationsToForgejoRepository -PreseamSdkVersion="${SDK_VERSION}" --no-daemon)
            fi
          }

          publish_jar_keyed() {
            local artifact_id="$1"
            local working_dir="$2"
            local classifier="$3"
            local jar_url="https://git.reseam.app/api/packages/reseam/maven/app/reseam/${artifact_id}/${SDK_VERSION}/${artifact_id}-${SDK_VERSION}-${classifier}.jar"
            if curl -fsS -I -H "Authorization: token ${FORGEJO_PACKAGES_TOKEN}" -o /dev/null "$jar_url"; then
              echo "app.reseam:${artifact_id}:${SDK_VERSION}:${classifier} already exists; skipping publish"
            else
              (cd "$working_dir" && ./gradlew publishAllPublicationsToForgejoRepository -PreseamSdkVersion="${SDK_VERSION}" -PreseamHostClassifier="${classifier}" --no-daemon)
            fi
          }

          publish_pom_keyed "reseam-patch-sdk" "patch-api"
          publish_pom_keyed "reseam-sdk-android" "sdk-android"
          publish_jar_keyed "reseam-sdk-jvm" "sdk-jvm" "${HOST_CLASSIFIER}"
        env:
          FORGEJO_PACKAGES_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}

      - run: install -D -m 0755 target/release/reseam dist/reseam-linux-x64

      - uses: https://code.forgejo.org/actions/forgejo-release@v2.11.1
        with:
          direction: upload
          url: https://git.reseam.app
          repo: reseam/reseam
          tag: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: dist
          override: true
