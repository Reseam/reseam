name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates nodejs openjdk-17-jdk-headless

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - run: cargo install boltffi_cli --version 0.23.1 --locked

      - run: ./kotlin-sdk/regenerate.sh
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - run: cargo build --release -p reseam-cli
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - run: install -D -m 0755 target/release/reseam dist/reseam-linux-x64

      - uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: https://git.reseam.app
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: dist
          override: true
