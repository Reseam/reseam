name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: docker
    container:
      image: cimg/android:2026.03-node
    env:
      LZMA_API_STATIC: "1"
    steps:
      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Add Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Cache cargo build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('.cargo/config.toml') }}

      - name: Cache boltffi_cli binary
        id: boltffi-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/boltffi
          key: boltffi-cli-0.24.1

      - name: Install boltffi_cli
        if: steps.boltffi-cache.outputs.cache-hit != 'true'
        run: cargo install boltffi_cli --version 0.24.1 --locked

      - name: Set up Gradle
        uses: https://github.com/gradle/actions/setup-gradle@v5

      - name: Regenerate patch-api bindings
        run: cargo xtask regen patch-api

      - name: Regenerate SDK bindings and Android jniLibs
        run: cargo xtask regen sdk

      - name: Build reseam-cli release binary
        run: cargo build --release -p reseam-cli

      - name: Build desktop JNI shim
        run: cargo xtask jni-host

      - name: Check the tag names the workspace version
        run: cargo xtask check-tag ${{ github.ref_name }}

      - name: Publish the SDKs to the Forgejo Maven registry
        env:
          FORGEJO_PACKAGES_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
        run: ./gradlew publishAllPublicationsToForgejoRepository -PreseamSdkVersion=${{ github.ref_name }} --no-daemon

      - name: Stage the CLI
        run: install -D target/release/reseam dist/reseam-linux-x64

      - name: Upload to the Forgejo release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.11.1
        with:
          direction: upload
          url: https://git.reseam.app
          repo: reseam/reseam
          tag: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: dist
          override: true
