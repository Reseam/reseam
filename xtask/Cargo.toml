[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Reseam build orchestration tasks"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
toml_edit = "0.25"
semver = { workspace = true }
boltffi_backend = { workspace = true }
boltffi_bindgen = { workspace = true }
boltffi_binding = { workspace = true }
reseam-dex = { path = "../crates/dex" }
reseam-apk = { path = "../crates/apk" }
reseam-model = { path = "../crates/model", features = ["typescript"] }
ts-rs = "12.0.1"
dprint-plugin-typescript = "0.95"
memmap2 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
cc = "1"
tempfile = { workspace = true }
zip = { workspace = true }

[lints]
workspace = true
